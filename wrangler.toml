name = "brianwinstonwebsite"
compatibility_date = "2026-06-03"
main = "worker/index.mjs"

[build]
command = "./scripts/build-hugo.sh"
watch_dir = ["content", "layouts", "assets", "static", "config"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/patch/*", "/patch-meetings", "/patch-meetings/*"]


# Create the database, then replace this placeholder before deploying.
[[d1_databases]]
binding = "DB"
database_name = "patch-meetings"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "worker/migrations"

[triggers]
crons = ["*/15 * * * *"]

[vars]
PUBLIC_ORIGIN = "https://brianwinston.com"
MAIL_MODE = "disabled"
# Set MAIL_FROM, ADMIN_EMAIL, and REPLY_TO via secrets or .dev.vars.
# LINK_SECRET, ADMIN_TOKEN and RESEND_API_KEY must be secrets.
